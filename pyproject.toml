[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-evidence-lab"
version = "0.1.0"
description = "Auditable AI review of reproducible quantitative research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4"]

[project.optional-dependencies]
ai = ["openai-agents==0.24.0", "openai==3.46.0"]

[project.scripts]
quant-evidence = "quant_evidence.cli:main"

[tool.setuptools.packages.find]
include = ["quant_evidence*"]
